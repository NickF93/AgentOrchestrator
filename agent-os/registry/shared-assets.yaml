    depends_on_assets:
      - checkpoint-closure-review
      - check-result-v1

  - id: codex/check-medium
    kind: profile
    version: "1.0.0"
    path: agent-os/profiles/codex/check-medium.yaml
    compatibility: [codex]
    materializable: true
    depends_on_assets:
      - checkpoint-closure-review
      - check-result-v1

  - id: check-result-v1
    kind: protocol
    version: "1.0.0"
    path: agent-os/protocols/check-result-v1.yaml
    compatibility: [claude, codex, kilo]
