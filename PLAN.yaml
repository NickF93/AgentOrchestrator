# PLAN.yaml — AgentOrchestrator (Level-0 Control Plane OS)
# Source of truth for the MVP construction plan of the agent-os/ control plane.
# PLAN.md and PLAN.dot are GENERATED views — do not edit them manually.
# Last updated: 2026-03-28

meta:
  repo: AgentOrchestrator
  owner: NickF93
  version: "0.1"
  schema_version: "draft-1.0"
  last_updated: "2026-03-28"
  note: >
    This PLAN.yaml is self-referential: it is the plan for building the very
    system (agent-os/) that will eventually validate and render itself.
    The schema and tooling defined here will be used to validate this file
    once M1.1.2 and M1.1.4 are complete.

mission: >
  Build the minimal viable Level-0 central control plane (agent-os/) inside
  this repository. Level-0 provides: shared workflow documentation, plan schema,
  templates for repo-local files, and render/validate scripts.
  This repository IS the control-plane OS (Level-0).
  Level-1 (workspace runtime) and Level-2 (repo-local bootstrap) come after.
  The plan is not only a progress tracker. It is the canonical execution graph
  for agent orchestration, optimized for decomposition into independently
  executable items, safe aggregation into reviewable commit groups, and
  controlled parallel execution under explicit dependency, scope, and policy
  constraints.

