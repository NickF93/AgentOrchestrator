# PLAN.yaml — AgentOrchestrator (Level-0 Control Plane OS)
# Source of truth for the MVP construction plan of the agent-os/ control plane.
# PLAN.md and PLAN.dot are GENERATED views — do not edit them manually.
# Last updated: 2026-03-28

meta:
  repo: AgentOrchestrator
  owner: NickF93
  version: "0.1"
  schema_version: "draft-1.0"
  last_updated: "2026-03-28"
  note: >
    This PLAN.yaml is self-referential: it is the plan for building the very
    system (agent-os/) that will eventually validate and render itself.
    The schema and tooling defined here will be used to validate this file
    once M1.1.2 and M1.1.4 are complete.

mission: >
  Build the minimal viable Level-0 central control plane (agent-os/) inside
  this repository. Level-0 provides: shared workflow documentation, plan schema,
  templates for repo-local files, and render/validate scripts.
  This repository IS the control-plane OS (Level-0).
  Level-1 (workspace runtime) and Level-2 (repo-local bootstrap) come after.

milestones:
  - id: X1
    type: X
    title: "Level-0 MVP — Control Plane Foundation"
    status: done

  - id: X2
    type: X
    title: "Layer-0 Governance Hardening"
    status: done
    note: >
      Close the compliance gaps between the design authority document
      (docs/design/documento-architetturale-control-plane-coding-agents.md)
      and the authoritative governance workflow files under agent-os/workflow/.
    note: >
      Deliver a working agent-os/ scaffold with schema, workflow docs, templates,
      and tooling. Self-validate by running validate-plan.py on this PLAN.yaml.

sprints:
  - id: S1.1
    type: S
    parent: X1
    title: "Sprint 1 — Decisions, scaffold, schema, workflow docs, templates, scripts"
    status: done

  - id: S2.1
    type: S
    parent: X2
    title: "Sprint 1 — Propagate missing architectural rules to governance files"
    status: done

items:

  # ─── D1.1.1: repository bootstrap hygiene ───────────────────────────────────────
  - id: D1.1.1
    parent: S1.1
    type: D
    title: "Create non-authoritative docs directory and initialize .gitignore"
    actions: [document]
    status: done
    role: orchestrator
    effort: low
    commit_group: cg0
    scope: "."
    artifacts_out:
      - .gitignore
      - docs/design/documento-architetturale-control-plane-coding-agents.md
      - docs/design/gitflow_pr_only_terminal_workflow.md
      - docs/design/REVIEW-AND-OPEN-QUESTIONS.md
    notes: >
      Moved startup documentation to docs/design/ as non-authoritative reference
      material and added baseline ignore rules for local/editor/runtime artifacts.

  # ─── D1.1.2: this review/open-questions document ────────────────────────────────
  - id: D1.1.2
    parent: S1.1
    type: D
    title: "Create architecture review and open-questions document"
    actions: [document]
    status: done
    role: orchestrator
    effort: low
    commit_group: cg1
    scope: "docs/design"
    artifacts_out:
      - docs/design/REVIEW-AND-OPEN-QUESTIONS.md
    notes: >
      Captures what is confirmed, what is ambiguous, and five open questions
      (Q1.1.1–Q1.1.5) that must be decided before schema and scripts can be written.

  - id: D1.1.3
    parent: S1.1
    type: D
    title: "Enforce commit message contract in Layer-0 governance"
    actions: [document, checkpoint]
    status: done
    role: orchestrator
    effort: low
    commit_group: cg6
    scope: "."
    artifacts_out:
      - AGENTS.md
      - agent-os/workflow/shared-workflow.md
      - agent-os/workflow/git-automation-policy.md
      - agent-os/templates/repo-AGENTS.md.template
    notes: >
      Added mandatory commit title contract:
      <type>(<scope>): [item ID] <description>
      with optional body/footer sections. This is a Layer-0 global rule.

  - id: D1.1.4
    parent: S1.1
    type: D
    title: "Strengthen and align commit body/footer recommendation wording"
    actions: [document]
    status: done
    role: orchestrator
    effort: low
    commit_group: cg6
    scope: "."
    artifacts_out:
      - AGENTS.md
      - agent-os/workflow/shared-workflow.md
      - agent-os/workflow/git-automation-policy.md
      - agent-os/templates/repo-AGENTS.md.template
    notes: >
      Standardized wording to: "Optional body and footer sections are strongly
      suggested, especially for medium or large commits." across all
      authoritative governance surfaces.

  # ─── Q items: decision gates ─────────────────────────────────────────────────
  - id: Q1.1.1
    parent: S1.1
    type: Q
    title: "Decide: PLAN.yaml required fields and state transition rules"
    actions: [decide]
    status: done
    role: orchestrator
    effort: low
    commit_group: cg2
    depends_on: [D1.1.2]
    scope: "agent-os/schemas"
    decision: >
      Required executable fields are id, type, title, status, role, effort.
      State machine is planned -> ready -> in_progress -> review -> verified ->
      done, with blocked as a side-state reachable from active states.
      Container items (X, S) must not appear in depends_on. verified means all
      required checks pass; done means verified plus repository bookkeeping
      closure (committed, optionally pushed).
    notes: >
      Decision recorded from interactive governance alignment.

  - id: Q1.1.2
    parent: S1.1
    type: Q
    title: "Decide: Level-1 runtime materialization strategy"
    actions: [decide]
    status: done
    role: orchestrator
    effort: low
    commit_group: cg2
    depends_on: [D1.1.2]
    scope: "agent-os/templates"
    decision: >
      Level-1 runtime files are fully generated by sync-workspace.sh from
      Level-0 templates. Generated files are read-only outputs and must include
      an AUTO-GENERATED header.
    notes: >
      Decision recorded from interactive governance alignment.

  - id: Q1.1.3
    parent: S1.1
    type: Q
    title: "Decide: control-plane release and consumption model"
    actions: [decide]
    status: done
    role: orchestrator
    effort: low
    commit_group: cg2
    depends_on: [D1.1.2]
    scope: "."
    decision: >
      MVP consumption tracks the control-plane main branch. Tag-based pinning
      will be introduced when a second external consumer is onboarded.
    notes: >
      Decision recorded from interactive governance alignment.

  - id: Q1.1.4
    parent: S1.1
    type: Q
    title: "Decide: scope field format and collision-detection semantics"
    actions: [decide]
    status: done
    role: orchestrator
    effort: low
    commit_group: cg2
    depends_on: [D1.1.2]
    scope: "agent-os/schemas"
    decision: >
      scope is a repository-relative path prefix. validate-plan.py emits a
      warning (not hard-fail) when two in_progress items share a scope prefix.
    notes: >
      Decision recorded from interactive governance alignment.

  - id: Q1.1.5
    parent: S1.1
    type: Q
    title: "Decide: tooling failure semantics and commit hygiene rules"
    actions: [decide]
    status: done
    role: orchestrator
    effort: low
    commit_group: cg2
    depends_on: [D1.1.2]
    scope: "agent-os/scripts"
    decision: >
      validate-plan.py hard-fails on missing required fields, unknown enum
      values, dangling depends_on references, and container types (X, S) in
      depends_on. Other policy checks can be warnings.
    notes: >
      Decision recorded from interactive governance alignment.

  # ─── M items: implementation ─────────────────────────────────────────────────
  - id: M1.1.1
    parent: S1.1
    type: M
    title: "Create agent-os/workflow/ documentation files"
    actions: [implement, document]
    status: done
    role: implementer
    effort: medium
    commit_group: cg3
    depends_on: [Q1.1.1, Q1.1.2, Q1.1.3]
    scope: "agent-os/workflow"
    artifacts_out:
      - agent-os/workflow/shared-workflow.md
      - agent-os/workflow/item-taxonomy.md
      - agent-os/workflow/lifecycle.md
      - agent-os/workflow/git-automation-policy.md
      - agent-os/workflow/portability-model.md
    notes: >
      Content sourced from docs/design/documento-architetturale-control-plane-coding-agents.md
      and docs/design/gitflow_pr_only_terminal_workflow.md. Do NOT duplicate content;
      these files are the canonical split of the monolithic architecture doc.

  - id: M1.1.6
    parent: S1.1
    type: M
    title: "Create root governance files for this Level-0 repository"
    actions: [design, implement, document]
    status: done
    role: implementer
    effort: medium
    commit_group: cg3
    depends_on: [Q1.1.1, Q1.1.2, Q1.1.3]
    scope: "."
    artifacts_out:
      - AGENTS.md
      - ARCHITECTURE.md
    notes: >
      This repository is itself the Level-0 control-plane OS. Root AGENTS.md
      and ARCHITECTURE.md define local authority mapping and structural
      constraints for building and evolving agent-os/.

  - id: M1.1.2
    parent: S1.1
    type: M
    title: "Create agent-os/schemas/plan.schema.json"
    actions: [design, implement]
    status: done
    role: implementer
    effort: medium
    commit_group: cg3
    depends_on: [Q1.1.1, Q1.1.4]
    scope: "agent-os/schemas"
    artifacts_out:
      - agent-os/schemas/plan.schema.json
    notes: >
      JSON Schema (draft-2020-12) for PLAN.yaml. Must encode required fields,
      enum values for type/status/role/effort/actions, and scope field format
      as decided in Q1.1.1 and Q1.1.4. Must be self-consistent so that this PLAN.yaml
      passes validation once M1.1.4 is done.

  - id: M1.1.3
    parent: S1.1
    type: M
    title: "Create agent-os/templates/ (AGENTS, ARCHITECTURE, REPO_MAP, PLAN)"
    actions: [design, implement]
    status: done
    role: implementer
    effort: medium
    commit_group: cg3
    depends_on: [Q1.1.2, M1.1.1]
    scope: "agent-os/templates"
    artifacts_out:
      - agent-os/templates/repo-AGENTS.md.template
      - agent-os/templates/repo-ARCHITECTURE.md.template
      - agent-os/templates/repo-REPO_MAP.md.template
      - agent-os/templates/PLAN.yaml.template
    notes: >
      Templates use {{REPO_NAME}}, {{DATE}}, {{OWNER}} placeholders.
      Level-1 files are generated from these templates by sync-workspace.sh
      (per Q1.1.2 decision). Each template must include the canonical source rule
      and authority map header so generated files self-document their origin.

  - id: M1.1.4
    parent: S1.1
    type: M
    title: "Create agent-os/scripts/render-plan.py and validate-plan.py"
    actions: [implement]
    status: done
    role: implementer
    effort: high
    commit_group: cg4
    depends_on: [M1.1.2, Q1.1.5]
    scope: "agent-os/scripts"
    artifacts_out:
      - agent-os/scripts/render-plan.py
      - agent-os/scripts/validate-plan.py
    notes: >
      validate-plan.py: validates PLAN.yaml against plan.schema.json; checks
      state transition legality, dangling depends_on, container items in
      depends_on, required fields. Exits non-zero on any hard-fail.
      render-plan.py: deterministic PLAN.yaml → PLAN.md + PLAN.yaml → PLAN.dot.
      Both scripts must be idempotent and callable standalone.

  - id: M1.1.5
    parent: S1.1
    type: M
    title: "Create agent-os/scripts/bootstrap-repo.sh and sync-workspace.sh"
    actions: [implement]
    status: done
    role: implementer
    effort: medium
    commit_group: cg4
    depends_on: [M1.1.3, Q1.1.3]
    scope: "agent-os/scripts"
    artifacts_out:
      - agent-os/scripts/bootstrap-repo.sh
      - agent-os/scripts/sync-workspace.sh
    notes: >
      bootstrap-repo.sh: instantiates a new repo-local layer (Level-2) from
      templates. Supports --dry-run. Emits a PLAN.yaml seed from the template.
      sync-workspace.sh: pulls latest from control plane (per Q1.1.3 decision) and
      regenerates Level-1 runtime files from Level-0 templates (per Q1.1.2 decision).

  # ─── T items: test / validation ──────────────────────────────────────────────
  - id: T1.1.1
    parent: S1.1
    type: T
    title: "Validate this PLAN.yaml against plan.schema.json"
    actions: [test, verify]
    status: done
    role: tester
    effort: low
    commit_group: cg5
    depends_on: [M1.1.2, M1.1.4]
    scope: "."
    checks:
      - "python agent-os/scripts/validate-plan.py PLAN.yaml exits 0"
      - "no required fields missing"
      - "no dangling depends_on references"
    notes: >
      This is the self-validation gate: the control plane must validate its own
      plan before it can claim to be a working control plane.

  - id: T1.1.2
    parent: S1.1
    type: T
    title: "Dry-run bootstrap-repo.sh on a temp path"
    actions: [test, verify]
    status: done
    role: tester
    effort: low
    commit_group: cg5
    depends_on: [M1.1.5]
    scope: "agent-os/scripts"
    checks:
      - "bash agent-os/scripts/bootstrap-repo.sh --dry-run /tmp/test-repo exits 0"
      - "expected output files listed without being created"
    notes: >
      Must confirm bootstrap is idempotent and does not write to disk in
      dry-run mode. A second run on the same target must produce identical output.

  - id: T1.1.3
    parent: S1.1
    type: T
    title: "Generate PLAN.md and PLAN.dot from this PLAN.yaml"
    actions: [test, verify]
    status: done
    role: tester
    effort: low
    commit_group: cg5
    depends_on: [M1.1.4]
    scope: "."
    checks:
      - "python agent-os/scripts/render-plan.py PLAN.yaml produces PLAN.md"
      - "python agent-os/scripts/render-plan.py PLAN.yaml produces PLAN.dot"
      - "running render a second time produces identical output (idempotency)"
    notes: >
      PLAN.md and PLAN.dot are committed in the same commit as this PLAN.yaml
      update, not as separate commits (per Q1.1.5 decision).

  # ─── C items: checkpoint ─────────────────────────────────────────────────────
  - id: C1.1.1
    parent: S1.1
    type: C
    title: "Sprint 1 checkpoint — Level-0 scaffold complete and self-validating"
    actions: [review, checkpoint, verify]
    status: done
    role: reviewer
    effort: low
    commit_group: cg5
    depends_on: [T1.1.1, T1.1.2, T1.1.3]
    checks:
      - "All S1.1 items are status: verified or done"
      - "PLAN.md and PLAN.dot are committed and match PLAN.yaml"
      - "No concern duplication detected (AGENTS vs ARCHITECTURE vs PLAN)"
      - "agent-os/ directory structure matches §15.1 of architecture doc"
      - "Each template file includes canonical source rule header"
      - "Commit messages follow: <type>(<scope>): [item ID] <description>"
      - "validate-plan.py passes on this PLAN.yaml"
    notes: >
      After this checkpoint, the control plane is operational and able to
      bootstrap its first real target repo (Level-2) as Sprint 2 work.

  # ─── S2.1 items ─────────────────────────────────────────────────────────────
  - id: D2.1.1
    parent: S2.1
    type: D
    title: "Enforce missing architectural doc rules in workflow governance files"
    actions: [document, review]
    status: done
    role: orchestrator
    effort: medium
    commit_group: cg7
    scope: "agent-os/workflow"
    artifacts_out:
      - agent-os/workflow/shared-workflow.md
      - agent-os/workflow/git-automation-policy.md
      - agent-os/workflow/portability-model.md
    notes: >
      Close compliance gaps between the architecture doc (§6.2–6.4, §11.3–11.4,
      §4.2, §13.2) and the authoritative workflow files. Adds: full authority
      concern table, precedence rule, non-duplication rule, single-writer rule
      detail, grouping and collision rules, deferred automation list, and Kilo
      portability mapping example.

commit_groups:
  - id: cg7
    title: "Governance compliance — propagate architectural rules to workflow docs"
    items: [D2.1.1]
    notes: >
      Closes doc-vs-code gaps in authority model, DAG execution rules,
      automation policy, and portability model (§6.2–6.4, §11.3–11.4,
      §4.2, §13.2 of the architecture document).

  - id: cg0
    title: "Repository bootstrap hygiene"
    items: [D1.1.1]
    notes: >
      Moves startup documents into docs/design/ and initializes .gitignore for
      local/editor/runtime artifacts.

  - id: cg1
    title: "Review and planning artifacts"
    items: [D1.1.2]
    notes: "Initial review doc plus this PLAN.yaml (self-referential first commit)"

  - id: cg6
    title: "Governance hardening updates"
    items: [D1.1.3, D1.1.4]
    notes: "Introduces mandatory commit message contract across Layer-0 governance."

  - id: cg2
    title: "Decision gates — Q1.1.1 through Q1.1.5 answers recorded"
    items: [Q1.1.1, Q1.1.2, Q1.1.3, Q1.1.4, Q1.1.5]
    notes: >
      All Q items must be decided before cg3 can start. Commit records
      the human owner's confirmed answers, which become binding constraints
      for the schema and scripts.

  - id: cg3
    title: "Scaffold — workflow docs, schema, templates"
    items: [M1.1.1, M1.1.2, M1.1.3, M1.1.6]
    notes: >
      M1.1.2 and M1.1.3 can proceed in parallel once Q decisions are confirmed.
      M1.1.1 and M1.1.3 both land in cg3 but M1.1.3 depends on M1.1.1 being done first.

  - id: cg4
    title: "Scripts — render, validate, bootstrap, sync"
    items: [M1.1.4, M1.1.5]
    notes: "M1.1.4 and M1.1.5 can proceed in parallel; both depend on cg3 output."

  - id: cg5
    title: "Sprint 1 closure — tests and checkpoint"
    items: [T1.1.1, T1.1.2, T1.1.3, C1.1.1]
    notes: >
      T1.1.1, T1.1.2, T1.1.3 can run in parallel. C1.1.1 gates the sprint closure.
      PLAN.md and PLAN.dot are committed here alongside PLAN.yaml update.
