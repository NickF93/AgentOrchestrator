milestones:
- id: X55
  type: X
  title: repo-map-refresh Skill Packaging
  status: done
  note: 'Package a procedural repo-map-refresh skill (issue #16) that refreshes a
    downstream repository''s REPO_MAP.md when a freshness trigger fires or the map
    is stale. The skill wraps the existing freshness contract: it re-derives the objective
    map sections (Entry Points, Main Modules, Test Map) from the live repository,
    surfaces proposed deltas for the judgment sections (Hot Paths, Fragile Areas)
    for operator confirmation, stamps last_validated_on/validated_by, and re-verifies
    with validate-plan.py --check-freshness. It does not redefine governance, delegates
    a missing map to repo-bootstrap, and embeds a worked dry-run walkthrough so the
    dry-run acceptance criterion is satisfied inline. The skill is validated through
    the skill-creator eval loop before closure.

    '
