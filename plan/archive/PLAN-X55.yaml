  notes: 'Remediates four eval-review findings from the root. (1) Judgment-section
    deltas (Hot Paths / Fragile Areas) are surfaced in the refresh report only and
    are never written into REPO_MAP.md; Step 5 stamps last_validated_on only over
    confirmed content (objective re-derivation + carried-forward or operator-confirmed
    judgment), removing the impossible "judgment confirmed" precondition and aligning
    with lifecycle.md and shared-workflow.md. (2) Normalizes objective-section vocabulary:
    "none" for confirmed-empty, "undetermined" for derivation-failed; eliminates "leave
    blank". (3) Adds a self-contained bootstrapped-empty-template eval and rewrites
    evals.json notes to match the committed eval set. (4) Tightens evals 1/3 assertions
    to enforce that the written map carries no proposed/confirm text. Bumps the skill
    to 0.3.0 and syncs shared-assets.yaml. Authority files (lifecycle.md, shared-workflow.md)
    are not modified.

    '
