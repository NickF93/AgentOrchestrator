    '
- id: T5.2.4
  parent: S5.2
  type: T
  title: Validate nn-2 flow for plan tooling, bootstrap, sync, and hook enforcement
  actions:
  - test
  - verify
  status: done
  role: tester
  effort: low
  commit_group: cg21
  depends_on:
  - D5.2.1
  - M5.2.2
  - M5.2.3
  scope: .
  checks:
  - conda run -n nn-2 python -m pip install -r requirements.txt succeeds
  - conda run -n nn-2 python agent-os/scripts/validate-plan.py PLAN.yaml exits 0
  - conda run -n nn-2 python agent-os/scripts/render-plan.py PLAN.yaml updates PLAN.md
    and PLAN.dot deterministically
  - .githooks/commit-msg accepts a valid title plus Refs footer and rejects missing
    Refs
  - bootstrap-repo.sh --dry-run derives current local control-plane ref when --ref
    is omitted and renders .githooks/commit-msg
  - sync-workspace.sh writes branch or detached state plus commit SHA without pulling
    from remote
