milestones:
- id: X5
  type: X
  title: Tracking Discipline and Canonical Consistency Hardening
  status: done
  note: 'Strengthen plan-first execution discipline and repair the remaining authority/template
    drift after the architecture review. This milestone makes commit_group boundaries
    explicit and non-ad-hoc, propagates the tracking and commit traceability rule
    across Level-0/1/2 artifacts, aligns ADR and REPO_MAP template semantics with
    canonical workflow rules, makes workspace sync materialize from local state without
    implicit remote mutation, and packages Python tooling dependencies for fresh checkouts.

    '
