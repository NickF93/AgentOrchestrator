milestones:
- id: X31
  type: X
  title: PLAN Splitting and Archival Foundation
  status: done
  note: 'Split the monolithic repo plan into a canonical plan/ entrypoint with active
    and archived fragments, keep aggregate validation and rendering deterministic,
    and propagate the new plan layout through Layer-0 tooling, skills, templates,
    and bootstrap flows. Sprint 3 reopens X31 to harden the split-plan runtime, remove
    legacy aggregate support from shared Python tooling, and bring the governed Python
    surface to warning-strict green gates with >95% per-file coverage for agent-os/scripts/.
    Sprint 4 reopens X31 one final time to harden deterministic closure behavior so
    the canonical generated plan views stay clean, consistent, and review-ready after
    the full gate path.

    '
