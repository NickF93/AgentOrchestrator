milestones:
- id: X9
  type: X
  title: Shared Layer-0 Asset Distribution and Two-Root Consumption
  status: done
  note: 'Implements the shared-asset foundation for stable Layer-0 prompts, skills,
    profiles, and protocols with a canonical registry, PLAN item references, workspace-first
    two-root resolution, and optional explicit vendoring for standalone Layer-2 repos.
    Local milestone numbering uses X9 because X7 is already allocated in this repository''s
    canonical plan.

    '
