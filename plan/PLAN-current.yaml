milestones:
- id: X45
  type: X
  title: Quick-Fix Skill Packaging
  status: in_progress
  note: 'Package a procedural quick-fix skill (issue #20) that scaffolds an F-type
    item plus its commit_group in plan/PLAN-current.yaml before any non-generated
    edit. The skill keeps the tracking-first invariant intact while removing
    hand-crafted YAML friction. It delegates branch creation to the
    gitflow-pr-only skill and embeds a worked tiny-fix walkthrough so the
    Simulated tiny fix scenario acceptance criterion is satisfied inline.

    '
