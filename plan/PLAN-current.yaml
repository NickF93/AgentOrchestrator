milestones:
- id: X34
  type: X
  title: Make plan tests independent from active PLAN-current state
  status: in_progress
  note: >
    Tests crash with IndexError when PLAN-current.yaml is empty after
    archival. Root cause: copy_split_plan copies live plan/ directory and
    tests assume non-empty active content. Fix by injecting synthetic
    fixture data so tests are self-contained. Closes #25.

sprints:
- id: S34.1
  type: S
  parent: X34
  title: "Sprint 1 \u2014 Self-contained test fixtures and empty-state coverage"
  status: in_progress

