milestones:
- id: X40
  type: X
  title: Structured Checks for Programmatic Verification
  status: in_progress
  note: >
    Implement mixed prose and structured PLAN item checks for issue #13.
    Structured checks are validated as metadata only and are not executed by
    validate-plan.py.

sprints:
- id: S40.1
  type: S
  parent: X40
  title: "Sprint 1 -- Schema, validator, docs, and validation"
  status: in_progress

items:
- id: D40.1.1
  parent: S40.1
  type: D
  title: Create X40 tracking plan and commit groups
  actions: [plan, document]
  status: done
  role: orchestrator
  effort: low
  commit_group: cg102
  scope: plan/
  artifacts_out:
    - plan/PLAN-current.yaml
    - PLAN.md
    - PLAN.dot

- id: M40.1.2
  parent: S40.1
  type: M
  title: Add structured checks to schema and validator fallback
  actions: [implement, verify]
  status: done
  depends_on: [D40.1.1]
  role: implementer
  effort: medium
  commit_group: cg103
  scope: agent-os/
  artifacts_out:
    - agent-os/schemas/plan.schema.json
    - agent-os/scripts/validate-plan.py

- id: T40.1.3
  parent: S40.1
  type: T
  title: Add structured check validation test coverage
  actions: [test, verify]
  status: done
  depends_on: [M40.1.2]
  role: tester
  effort: medium
  commit_group: cg103
  scope: tests/
  artifacts_out:
    - tests/test_validate_plan.py

- id: D40.1.4
  parent: S40.1
  type: D
  title: Document structured checks and update roadmap state
  actions: [document]
  status: ready
  depends_on: [T40.1.3]
  role: documenter
  effort: low
  commit_group: cg104
  scope: .
  artifacts_out:
    - agent-os/workflow/item-taxonomy.md
    - agent-os/skills/plan-checkpoint-close/SKILL.md
    - agent-os/registry/shared-assets.yaml
    - TODO.md

- id: T40.1.5
  parent: S40.1
  type: T
  title: Validate X40 structured checks feature
  actions: [test, verify]
  status: planned
  depends_on: [D40.1.4]
  role: reviewer
  effort: low
  commit_group: cg104
  scope: .
  checks:
    - validate-plan.py exits 0
    - render-plan.py produces no drift
    - run-gates.sh passes

- id: C40.1.6
  parent: S40.1
  type: C
  title: "Checkpoint closure -- X40 structured checks"
  actions: [checkpoint, verify]
  status: planned
  depends_on: [T40.1.5]
  role: reviewer
  effort: low
  commit_group: cg104
  scope: .
  shared_assets:
    skill: plan-checkpoint-close
    prompt: checkpoint-closure-review
    result_protocol: check-result-v1
  artifacts_out:
    - plan/PLAN-current.yaml
    - plan/PLAN-index.yaml
    - plan/archive/PLAN-X40.yaml
    - PLAN.md
    - PLAN.dot

commit_groups:
- id: cg102
  title: "Structured checks -- tracking plan"
  items: [D40.1.1]
  notes: >
    Creates X40 tracking and commit-group boundaries before implementation.

- id: cg103
  title: "Structured checks -- schema, validator, and tests"
  items: [M40.1.2, T40.1.3]
  notes: >
    Adds mixed prose and structured checks support to the PLAN schema,
    validate-plan.py fallback validation, and regression tests.

- id: cg104
  title: "Structured checks -- docs, TODO, validation, and closure"
  items: [D40.1.4, T40.1.5, C40.1.6]
  notes: >
    Documents structured check metadata, updates roadmap state, validates the
    feature, and closes X40.
