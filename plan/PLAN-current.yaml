milestones:
- id: X53
  type: X
  title: Archive Digest Summaries
  status: in_progress
  note: Add generated, non-authoritative archive digest summaries so closed milestone
    history can be scanned without loading every archive fragment.
sprints:
- id: S53.1
  type: S
  parent: X53
  title: Sprint 1 -- Archive digest generation and lookup workflow
  status: in_progress
items:
- id: D53.1.1
  parent: S53.1
  type: D
  title: Open X53 archive digest tracking
  actions:
  - plan
  - document
  status: done
  role: orchestrator
  effort: low
  commit_group: cg140
  scope: plan/
  artifacts_out:
  - plan/PLAN-current.yaml
  - PLAN.md
  - PLAN.dot
  checks:
  - X53 active plan declares implementation, test, documentation, and closure commit
    groups before non-generated implementation files are edited
- id: M53.1.2
  parent: S53.1
  type: M
  title: Add deterministic archive digest generation
  actions:
  - implement
  status: planned
  depends_on:
  - D53.1.1
  role: implementer
  effort: medium
  commit_group: cg141
  scope: agent-os/scripts/
  artifacts_out:
  - agent-os/scripts/render-archive-digest.py
  - agent-os/scripts/archive-plan.py
  - plan/archive/DIGEST.md
  checks:
  - render-archive-digest.py writes plan/archive/DIGEST.md from plan/PLAN-index.yaml
  - archive-plan.py regenerates plan/archive/DIGEST.md after archiving a milestone
  - digest output is deterministic and derived only from split-plan archive data
- id: T53.1.3
  parent: S53.1
  type: T
  title: Verify archive digest generation and archive integration
  actions:
  - test
  - verify
  status: planned
  depends_on:
  - M53.1.2
  role: tester
  effort: medium
  commit_group: cg141
  scope: tests/
  artifacts_out:
  - tests/test_archive_digest.py
  - tests/test_archive_plan.py
  checks:
  - tests cover digest rendering, default output path, missing input handling, empty
    archives, markdown escaping, and archive-plan digest regeneration
- id: D53.1.4
  parent: S53.1
  type: D
  title: Document archive digest convention and lookup workflow
  actions:
  - document
  - review
  status: planned
  depends_on:
  - T53.1.3
  role: documenter
  effort: low
  commit_group: cg142
  scope: agent-os/workflow/
  artifacts_out:
  - agent-os/workflow/shared-workflow.md
  - README.md
  - TODO.md
  - agent-os/skills/plan-validate-render/SKILL.md
  checks:
  - documentation states archive digest summaries are generated and non-authoritative
  - lookup workflow points from digest rows back to indexed archive fragments
  - TODO.md marks digest-style historical summaries complete
- id: C53.1.5
  parent: S53.1
  type: C
  title: Checkpoint closure -- X53 archive digest summaries
  actions:
  - checkpoint
  - verify
  status: planned
  depends_on:
  - D53.1.4
  role: reviewer
  effort: low
  commit_group: cg142
  scope: .
  shared_assets:
    skill: plan-checkpoint-close
    prompt: checkpoint-closure-review
    result_protocol: check-result-v1
  artifacts_out:
  - plan/PLAN-current.yaml
  - plan/PLAN-index.yaml
  - plan/archive/PLAN-X53.yaml
  - plan/archive/DIGEST.md
  - PLAN.md
  - PLAN.dot
  checks:
  - validate-plan.py exits 0
  - render-plan.py produces no drift
  - render-archive-digest.py produces no drift
  - git diff --check passes
  - run-gates.sh passes
