milestones:
- id: X56
  type: X
  title: repo-map-refresh Placeholder-Stub Remediation
  status: in_progress
  note: 'Root-cause fix for a defect introduced by the X55 cg148 report-only remediation:
    the Step 5 rule "carry the prior confirmed values forward unchanged" preserves
    unfilled judgment template stubs (hot_path_N / fragile_area_N), so a stamped,
    "validated" REPO_MAP.md can still contain template placeholders. Make Step 5 symmetric
    with Step 3 (an unfilled stub is the absence of a confirmed value -> record "none";
    carry forward only real prior values), and strengthen the evals.json assertions
    that missed the leak. Bumps the skill to 0.3.1 and re-validates via the skill-creator
    eval loop. Authority files (lifecycle.md, shared-workflow.md) are not modified.

    '
